
name: Deploy SFWorks Portfolio Arin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfworks-arin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Arin to DirectAdmin
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send authenticated deployment request
        env:
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = "https://shirinzahra-portfolio.sfworks.top/_deploy/deploy.php"
          username = os.environ["DEPLOY_USERNAME"]
          password = os.environ["DEPLOY_PASSWORD"]
          secret = os.environ["DEPLOY_SECRET"]

          if len(secret) != 64 or any(c not in "0123456789abcdef" for c in secret):
              raise SystemExit("DEPLOY_SECRET must be 64 lowercase hex characters")

          body = json.dumps({
              "repository": os.environ["REPOSITORY"],
              "branch": "main",
              "commit": os.environ["COMMIT_SHA"]
          }, separators=(",", ":")).encode("utf-8")

          timestamp = str(int(time.time()))
          signature = hmac.new(
              secret.encode("utf-8"),
              timestamp.encode("utf-8") + b"." + body,
              hashlib.sha256
          ).hexdigest()

          credentials = base64.b64encode(
              f"{username}:{password}".encode("utf-8")
          ).decode("ascii")

          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Basic " + credentials,
                  "X-Deploy-Timestamp": timestamp,
                  "X-Deploy-Signature": signature,
                  "User-Agent": "SFWorks-Arin-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=170) as response:
                  result = response.read().decode("utf-8")
                  print("HTTP:", response.status)
                  print("Response:", result)

                  if response.status != 200:
                      raise SystemExit("Deployment unsuccessful")

                  parsed = json.loads(result)
                  message = parsed.get("message", "")

                  if not isinstance(message, str) or not (
                      message.startswith("Auto-sync completed: ")
                      or message == "Commit already deployed"
                  ):
                      raise SystemExit("Unexpected deployment response")

                  print("Portfolio Arin deployment verified successfully")

          except urllib.error.HTTPError as error:
              print("Deployment HTTP error:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Deployment connection failed:", error.reason)
              raise SystemExit(1)
          PY
